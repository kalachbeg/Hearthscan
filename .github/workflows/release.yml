name: Release

# A tag such as v2.0.0 builds the binaries, smoke tests them and publishes a
# GitHub release with the binaries and SHA256SUMS. Running the workflow by
# hand only builds and tests; the binaries are kept as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: hearthscan-windows-x64.exe
            extras: --extra window
          - os: macos-15
            asset: hearthscan-macos-arm64
            extras: --extra window
          # The last Intel image GitHub offers, available until August 2027.
          - os: macos-15-intel
            asset: hearthscan-macos-x64
            extras: --extra window
          - os: ubuntu-24.04
            asset: hearthscan-linux-x64
            extras: ""
          - os: ubuntu-24.04-arm
            asset: hearthscan-linux-arm64
            extras: ""
    defaults:
      run:
        shell: bash
    env:
      ASSET: ${{ matrix.asset }}
      # The binary carries its own Python. uv's standalone builds of Python run
      # on older systems than the ones the runner images ship with.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - run: uv sync --locked ${{ matrix.extras }}
      - run: uv run --with pyinstaller==6.22.3 pyinstaller packaging/hearthscan.spec
      - name: Name the binary after its release asset
        run: |
          if [ -f dist/hearthscan.exe ]; then
            mv dist/hearthscan.exe "dist/$ASSET"
          else
            mv dist/hearthscan "dist/$ASSET"
          fi
          ls -l dist
      - name: Smoke test
        run: |
          bin="./dist/$ASSET"
          version=$(uv run python -c "import hearthscan; print(hearthscan.__version__)" | tr -d '\r')
          printed=$("$bin" --version | tr -d '\r')
          echo "$printed"
          if [ "$printed" != "hearthscan $version" ]; then
            echo "::error::--version printed '$printed', expected 'hearthscan $version'"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
          "$bin" --help > /dev/null
          "$bin" scan --help > /dev/null
          # A runner may have no local network at all, which is status 1.
          status=0
          "$bin" net --json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::net --json exited with status $status"
            exit 1
          fi
          # Without the language files every text would show up as its key.
          status=0
          "$bin" net --lang tr > net.txt 2>&1 || status=$?
          cat net.txt
          if [ "$status" -gt 1 ] || grep -Eq '(^|[^A-Za-z])ui\.[a-z_]+' net.txt; then
            echo "::error::the Turkish texts are missing from the binary"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that the tag matches hearthscan.__version__
        run: |
          version=$(sed -n "s/^__version__ = [\"']\([^\"']*\)[\"'].*/\1/p" src/hearthscan/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match hearthscan.__version__ ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: hearthscan-*
          path: assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          sha256sum hearthscan-* > SHA256SUMS
          cat SHA256SUMS
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Hearthscan $VERSION" > notes.md
          fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Pre-releases never become "latest", which is what the launchers download.
          prerelease=""
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+|dev'; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" assets/* \
            --verify-tag --title "Hearthscan $VERSION" --notes-file notes.md $prerelease

  pypi:
    name: PyPI
    needs: release
    # Stays off until the maintainer sets the repository variable PUBLISH_PYPI
    # to true and registers this workflow as a trusted publisher on PyPI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.3
