[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hearthscan"
dynamic = ["version"]
description = "Find out what is on your home network and what it exposes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "kalachbeg" }]
keywords = ["network", "lan", "home-network", "security", "scanner", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "ifaddr>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/kalachbeg/Hearthscan"
Issues = "https://github.com/kalachbeg/Hearthscan/issues"
Changelog = "https://github.com/kalachbeg/Hearthscan/blob/main/CHANGELOG.md"

[project.scripts]
hearthscan = "hearthscan.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.hatch.version]
path = "src/hearthscan/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
